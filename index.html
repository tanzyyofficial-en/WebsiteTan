<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chat Anonim</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    html, body { height: 100%; width: 100%; overflow: hidden; background-color: #0b141a; color: #e9edef; }
    
    .chat-container { 
      width: 100%; 
      max-width: 500px; 
      margin: 0 auto;
      display: flex; 
      flex-direction: column; 
      height: 100vh; 
      height: 100dvh; 
      background-color: #0b141a; 
      position: relative; 
    }
    
    /* Header */
    .header { background-color: #202c33; padding: 10px 15px; display: flex; align-items: center; gap: 10px; cursor: pointer; border-bottom: 1px solid #2a3942; flex-shrink: 0; }
    .avatar { width: 42px; height: 42px; background-color: #6b7c85; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }
    .user-info { display: flex; flex-direction: column; }
    .user-name { font-weight: bold; font-size: 16px; color: #e9edef; }
    .user-status { font-size: 12px; color: #8696a0; }

    /* Admin Bar */
    .admin-bar { background-color: #111b21; padding: 8px 15px; display: none; align-items: center; justify-content: space-between; border-bottom: 1px solid #00a884; flex-shrink: 0; }
    .admin-bar label { font-size: 12px; color: #00a884; font-weight: bold; }
    .admin-bar select { background: #202c33; color: #fff; border: 1px solid #2a3942; padding: 5px; border-radius: 5px; max-width: 200px; }

    /* Area Chat dengan Wallpaper Kucing */
.chat-box { 
  flex: 1; 
  padding: 15px; 
  overflow-y: auto; 
  display: flex; 
  flex-direction: column; 
  gap: 10px; 
  
  /* Link Gambar Kucing Kamu Ditambahkan Di Sini */https://i.ibb.co/nsmp5xnP/314.jpg
  background-image: linear-gradient(rgba(11, 20, 26, 0.75), rgba(11, 20, 26, 0.75)), url('https://i.ibb.co/nsmp5xnP/314.jpg'); 
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}
    
    /* Area Input Pesan */
    .input-area { background-color: #202c33; padding: 10px; display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .icon-btn { background: none; border: none; fill: #8696a0; cursor: pointer; padding: 5px; display: flex; align-items: center; justify-content: center; }
    .icon-btn:hover { fill: #aebac1; }
    .input-area input[type="text"] { flex: 1; background-color: #2a3942; border: none; padding: 10px 15px; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
    .send-btn { background-color: #00a884; border: none; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
    .send-btn svg { fill: #fff; width: 20px; height: 20px; }

    /* Panel Sticker / Emoji */
    .media-panel { display: none; background-color: #111b21; border-top: 1px solid #2a3942; height: 180px; padding: 10px; overflow-y: auto; flex-shrink: 0; }
    .media-tabs { display: flex; gap: 15px; border-bottom: 1px solid #2a3942; padding-bottom: 8px; margin-bottom: 10px; }
    .tab-btn { color: #8696a0; background: none; border: none; font-weight: bold; cursor: pointer; font-size: 13px; }
    .tab-btn.active { color: #00a884; border-bottom: 2px solid #00a884; }
    .grid-container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
    .emoji-item { font-size: 24px; text-align: center; cursor: pointer; }
    .sticker-item { width: 100%; height: 60px; object-fit: contain; cursor: pointer; border-radius: 4px; }
  </style>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

  <div class="chat-container">
    <div class="header" onclick="toggleAdminMode()">
      <div class="avatar">S</div>
      <div class="user-info">
        <span class="user-name">Sultan Website (+6281919363625)</span>
        <span class="user-status" id="user-status-text">Online</span>
      </div>
    </div>

    <div class="admin-bar" id="adminBar">
      <label>MODE ADMIN</label>
      <select id="userSelect" onchange="switchChatUser(this.value)">
        <option value="">Pilih Chat User...</option>
      </select>
    </div>

    <div class="chat-box" id="chatBox"></div>

    <div class="media-panel" id="mediaPanel">
      <div class="media-tabs">
        <button class="tab-btn active" onclick="switchTab('emoji')">Emoji</button>
        <button class="tab-btn" onclick="switchTab('stiker')">Stiker</button>
      </div>
      <div id="emojiGrid" class="grid-container">
        <span class="emoji-item" onclick="sendEmoji('😊')">😊</span>
        <span class="emoji-item" onclick="sendEmoji('😂')">😂</span>
        <span class="emoji-item" onclick="sendEmoji('😍')">😍</span>
        <span class="emoji-item" onclick="sendEmoji('😭')">😭</span>
        <span class="emoji-item" onclick="sendEmoji('😎')">😎</span>
        <span class="emoji-item" onclick="sendEmoji('👍')">👍</span>
        <span class="emoji-item" onclick="sendEmoji('🔥')">🔥</span>
        <span class="emoji-item" onclick="sendEmoji('❤️')">❤️</span>
        <span class="emoji-item" onclick="sendEmoji('🙏')">🙏</span>
        <span class="emoji-item" onclick="sendEmoji('🤣')">🤣</span>
      </div>
      <div id="stikerGrid" class="grid-container" style="display: none;">
        <img class="sticker-item" src="https://cdn-icons-png.flaticon.com/512/4712/4712035.png" onclick="sendSticker(this.src)">
        <img class="sticker-item" src="https://cdn-icons-png.flaticon.com/512/4712/4712038.png" onclick="sendSticker(this.src)">
        <img class="sticker-item" src="https://cdn-icons-png.flaticon.com/512/4712/4712027.png" onclick="sendSticker(this.src)">
        <img class="sticker-item" src="https://cdn-icons-png.flaticon.com/512/4712/4712009.png" onclick="sendSticker(this.src)">
      </div>
    </div>

    <div class="input-area">
      <button class="icon-btn" onclick="toggleMediaPanel()">
        <svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/></svg>
      </button>

      <label class="icon-btn" style="cursor: pointer;">
        <svg width="24" height="24" viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4s-4 1.79-4 4v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z"/></svg>
        <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="sendImage(this)">
      </label>

      <input type="text" id="messageInput" placeholder="Ketik pesan" onkeypress="handleKeyPress(event)">
      
      <button class="send-btn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      databaseURL: "https://tannop-a6595-default-rtdb.firebaseio.com",
      apiKey: "AIzaSyAtBdFjls2BakeQS3nxzocpdCdBMHT8IWg",
      authDomain: "tannop-a6595.firebaseapp.com",
      projectId: "tannop-a6595",
      storageBucket: "tannop-a6595.firebasestorage.app",
      messagingSenderId: "982755504714",
      appId: "1:982755504714:web:d4edd52d01aabf5a312cb3",
      measurementId: "G-37Z6PJVHJW"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let visitorId = localStorage.getItem('visitor_id');
    if (!visitorId) {
      visitorId = 'user_' + Math.random().toString(36).substring(2, 9);
      localStorage.setItem('visitor_id', visitorId);
    }

    let isAdmin = false;
    let activeChatUser = visitorId;

    function toggleAdminMode() {
      const password = prompt("Masukkan kata sandi Admin:");
      if (password === 'nng') {
        isAdmin = true;
        document.getElementById('adminBar').style.display = 'flex';
        document.getElementById('user-status-text').innerText = 'Mode Admin Aktif';
        alert("Selamat datang Admin!");
        listenForUsers();
      } else if (password !== null) {
        alert("Password salah!");
      }
    }

    function listenForUsers() {
      db.ref('messages').on('value', (snapshot) => {
        const select = document.getElementById('userSelect');
        select.innerHTML = '<option value="">Pilih Chat User...</option>';
        const users = snapshot.val();
        if (users) {
          Object.keys(users).forEach(uid => {
            const opt = document.createElement('option');
            opt.value = uid;
            opt.innerText = uid;
            select.appendChild(opt);
          });
        }
      });
    }

    function switchChatUser(uid) {
      if (!uid) return;
      activeChatUser = uid;
      loadMessages();
    }

    function loadMessages() {
      const chatBox = document.getElementById('chatBox');
      chatBox.innerHTML = '';

      db.ref('messages/' + activeChatUser).off();
      db.ref('messages/' + activeChatUser).on('child_added', (snapshot) => {
        const msg = snapshot.val();
        let isSentByMe = false;
        
        if (isAdmin) {
          isSentByMe = (msg.sender === 'admin');
        } else {
          isSentByMe = (msg.sender === visitorId);
        }

        displayMessage(msg.text, msg.imgUrl, isSentByMe ? 'sent' : 'received', msg.time);
      });
    }

    function displayMessage(text, imgUrl, type, time) {
      const chatBox = document.getElementById('chatBox');
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', type);
      
      let html = '';
      if (text) html += `<div>${text}</div>`;
      if (imgUrl) html += `<img src="${imgUrl}" />`;
      html += `<span class="time">${time}</span>`;

      msgDiv.innerHTML = html;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function sendMessage(customText = null, customImg = null) {
      const input = document.getElementById('messageInput');
      const text = customText !== null ? customText : input.value.trim();
      
      if (!text && !customImg) return;

      const now = new Date();
      const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');

      const messageData = {
        sender: isAdmin ? 'admin' : visitorId,
        text: text || '',
        imgUrl: customImg || '',
        time: timeStr,
        timestamp: Date.now()
      };

      db.ref('messages/' + activeChatUser).push(messageData);
      if (customText === null) input.value = '';
    }

    function sendImage(fileInput) {
      const file = fileInput.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          sendMessage('', e.target.result);
        };
        reader.readAsDataURL(file);
      }
    }

    function toggleMediaPanel() {
      const panel = document.getElementById('mediaPanel');
      panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (tab === 'emoji') {
        document.getElementById('emojiGrid').style.display = 'grid';
        document.getElementById('stikerGrid').style.display = 'none';
        event.target.classList.add('active');
      } else {
        document.getElementById('emojiGrid').style.display = 'none';
        document.getElementById('stikerGrid').style.display = 'grid';
        event.target.classList.add('active');
      }
    }

    function sendEmoji(emoji) {
      const input = document.getElementById('messageInput');
      input.value += emoji;
    }

    function sendSticker(stickerUrl) {
      sendMessage('', stickerUrl);
      toggleMediaPanel();
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') sendMessage();
    }

    // Jalankan pemuatan pesan secara langsung
    loadMessages();
  </script>
</body>
          </html>
